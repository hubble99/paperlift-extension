<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paperlift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="../icons/icon32.png" alt="" width="20" height="20">
      <span class="wordmark">Paperlift</span>
    </div>
    <span id="host" class="host"></span>
  </header>

  <main>
    <section class="block" aria-labelledby="pdf-title">
      <div class="block-head">
        <h2 id="pdf-title">PDF <span id="pdf-count" class="pill" hidden></span></h2>
        <button id="dl-all" class="btn btn-ghost btn-sm" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Download all</span>
        </button>
      </div>
      <ul id="pdf-list" class="list"></ul>
      <div id="pdf-empty" class="empty" hidden>
        <svg class="empty-art" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 6h14l10 10v24a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M28 6v7a3 3 0 0 0 3 3h7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M18 27h12M18 33h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p id="empty-title" class="empty-title">No PDFs detected</p>
        <p id="empty-sub" class="empty-sub"></p>
      </div>
    </section>

    <section id="slide-section" class="block card" hidden aria-labelledby="slide-title">
      <div class="block-head">
        <h2 id="slide-title">Slides detected: <span id="slide-count">0</span> pages</h2>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <p id="slide-note" class="note" hidden></p>
      <div id="progress" class="progress" hidden>
        <div class="bar"><span id="bar-fill"></span></div>
        <p id="slide-progress" class="progress-text" aria-live="polite"></p>
      </div>
      <div class="actions">
        <button id="merge" class="btn btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Merge into PDF</span>
        </button>
        <button id="load-all" class="btn btn-ghost">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Load all slides</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>Only for material you have access to.</span>
    <a href="https://github.com/hubble99/paperlift-extension#readme" target="_blank" rel="noopener">Help</a>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
