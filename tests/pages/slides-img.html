<h1>Slide gambar biasa</h1>

<p>12 slide. Urutan di DOM sengaja diacak, tetapi tiap slide punya <code>data-page</code>. PDF hasil harus urut 1–12 (jumlah kotak putih = nomor slide).</p>
<img src="/slide/1.png?w=64&h=64" alt="logo" class="logo" width="64">
<div class="deck"><div class="slide" data-page="8"><img src="/slide/8.png?w=960&h=540" alt="Slide 8"></div>
<div class="slide" data-page="12"><img src="/slide/12.png?w=960&h=540" alt="Slide 12"></div>
<div class="slide" data-page="4"><img src="/slide/4.png?w=960&h=540" alt="Slide 4"></div>
<div class="slide" data-page="11"><img src="/slide/11.png?w=960&h=540" alt="Slide 11"></div>
<div class="slide" data-page="9"><img src="/slide/9.png?w=960&h=540" alt="Slide 9"></div>
<div class="slide" data-page="5"><img src="/slide/5.png?w=960&h=540" alt="Slide 5"></div>
<div class="slide" data-page="10"><img src="/slide/10.png?w=960&h=540" alt="Slide 10"></div>
<div class="slide" data-page="2"><img src="/slide/2.png?w=960&h=540" alt="Slide 2"></div>
<div class="slide" data-page="1"><img src="/slide/1.png?w=960&h=540" alt="Slide 1"></div>
<div class="slide" data-page="7"><img src="/slide/7.png?w=960&h=540" alt="Slide 7"></div>
