<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Petik — promo tile</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: radial-gradient(420px 260px at 95% 0%, rgba(36,82,79,.14), transparent 70%), #f3f0e8;
    color: #24524f;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 40px;
    box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  img { width: 68px; height: 68px; filter: drop-shadow(0 6px 14px rgba(36,82,79,.25)); }
  .name { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 19px; color: #4d5559; max-width: 340px; }
  .accent { color: #c96f45; font-weight: 600; }
</style>
</head>
<body data-ready="1">
  <div class="row"><img src="../../brand/logo.svg" alt=""><span class="name">Petik</span></div>
  <p>Simpan <span class="accent">PDF</span> &amp; <span class="accent">slide</span> dari halaman web dengan satu klik.</p>
</body>
</html>
