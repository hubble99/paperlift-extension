<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Paperlift — screenshot</title>
<style>
  :root { --bg: #f3f0e8; --text: #23272a; --muted: #6b7378; --ink: #24524f; --card: #ffffff; --line: #e4e0d6; --skel: #eeebe4; }
  :root.dark { --bg: #141718; --text: #ecebe6; --muted: #9aa09f; --ink: #7fb3ac; --card: #1d2122; --line: #2c3233; --skel: #262b2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 85% 10%, color-mix(in srgb, var(--ink) 10%, transparent), transparent 60%), var(--bg);
    color: var(--text);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 520px 1fr;
    align-items: center;
    gap: 40px;
    padding: 0 72px 0 88px;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  h1 { font-size: 44px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 18px; font-weight: 700; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 19px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { display: flex; gap: 12px; align-items: flex-start; font-size: 17px; }
  li svg { flex: none; width: 22px; height: 22px; margin-top: 2px; color: var(--ink); }

  .window {
    position: relative;
    height: 640px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 24px 60px -24px rgba(20,40,40,.25);
    overflow: hidden;
  }
  .bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .url { margin-left: 14px; flex: 1; height: 26px; border-radius: 13px; background: var(--skel); color: var(--muted); font-size: 13px; display: flex; align-items: center; padding: 0 14px; }
  .tb-icon { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 14%, transparent); }
  .tb-icon img { width: 18px; height: 18px; }
  .page { padding: 34px 36px; display: grid; gap: 14px; }
  .skel { height: 14px; border-radius: 7px; background: var(--skel); }
  .skel.h { height: 26px; width: 55%; }
  .viewer { height: 340px; border-radius: 10px; background: var(--skel); margin-top: 8px; }

  .popup {
    position: absolute;
    top: 52px;
    right: 18px;
    width: 360px;
    border: 0;
    border-radius: 12px;
    transform: scale(1.3);
    transform-origin: top right;
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px -12px rgba(20,40,40,.35);
    background: transparent;
  }
</style>
</head>
<body>
  <section>
    <div class="brand"><img src="../../brand/logo.svg" alt=""><span>Paperlift</span></div>
    <h1 id="h"></h1>
    <p class="sub" id="s"></p>
    <ul id="b"></ul>
  </section>
  <div class="window">
    <div class="bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="url" id="u"></span>
      <span class="tb-icon"><img src="../../icons/icon32.png" alt=""></span>
    </div>
    <div class="page">
      <div class="skel h"></div>
      <div class="skel" style="width:85%"></div>
      <div class="skel" style="width:70%"></div>
      <div class="viewer"></div>
    </div>
    <iframe class="popup" id="p" scrolling="no"></iframe>
  </div>
<script>
  const COPY = {
    pdf: {
      h: 'Simpan PDF yang tombol unduhnya disembunyikan.',
      s: 'Paperlift menemukan PDF yang sudah dimuat di halaman, termasuk di dalam viewer pdf.js, lalu menyimpannya dengan satu klik.',
      b: ['Deteksi otomatis: iframe, embed, link, dan jaringan', 'Cara cadangan saat server menolak (403)', 'Nama file rapi dan aman untuk semua sistem'],
      u: 'kelas-contoh.id/kursus/python/sesi-3',
    },
    slides: {
      h: 'Slide berbentuk gambar? Gabungkan jadi satu PDF.',
      s: 'Paperlift mengenali deretan slide di halaman, memuat semuanya, lalu menyusunnya menjadi PDF langsung di browser Anda.',
      b: ['Resolusi gambar terbesar yang tersedia', 'Urutan halaman dikenali otomatis', 'Tidak ada data yang dikirim ke server mana pun'],
      u: 'kelas-contoh.id/kursus/ml/slide-1',
    },
    dark: {
      h: 'Tenang dipakai, siang maupun malam.',
      s: 'Tampilan minimal yang otomatis mengikuti mode gelap sistem Anda.',
      b: ['Tanpa akun dan tanpa iklan', 'Semua proses berjalan lokal di browser', 'Gratis dan open source'],
      u: 'kelas-contoh.id/kursus/python/sesi-3',
    },
  };
  const mock = new URLSearchParams(location.search).get('mock') || 'pdf';
  const c = COPY[mock];
  if (mock === 'dark') document.documentElement.classList.add('dark');
  document.getElementById('h').textContent = c.h;
  document.getElementById('s').textContent = c.s;
  document.getElementById('u').textContent = c.u;
  const check = '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="currentColor" opacity=".14"/><path d="M6.5 11.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.getElementById('b').innerHTML = c.b.map((t) => `<li>${check}<span>${t}</span></li>`).join('');
  const frame = document.getElementById('p');
  frame.addEventListener('load', () => {
    const fit = () => { frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px'; };
    fit();
    setTimeout(() => { fit(); document.body.dataset.ready = '1'; }, 400);
  });
  frame.src = `../../popup/popup.html?mock=${mock}`;
</script>
</body>
</html>
